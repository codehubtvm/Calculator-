<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASIO fx-991CW</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&family=Roboto+Condensed:wght@300;400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a2e;
    background-image: radial-gradient(ellipse at 30% 20%, #16213e 0%, #0f3460 50%, #1a1a2e 100%);
    font-family: 'Roboto Condensed', sans-serif;
    padding: 20px;
  }

  .calculator {
    width: 300px;
    background: linear-gradient(175deg, #1b2a5e 0%, #0e1a3e 40%, #0a1230 100%);
    border-radius: 18px 18px 26px 26px;
    padding: 0;
    box-shadow:
      0 0 0 1px #3a4f8a,
      0 4px 8px rgba(0,0,0,0.8),
      0 20px 60px rgba(0,0,0,0.9),
      inset 0 1px 0 rgba(255,255,255,0.08);
    position: relative;
    overflow: visible;
  }

  /* Top rounded header */
  .calc-header {
    padding: 14px 16px 10px;
    border-radius: 18px 18px 0 0;
    background: linear-gradient(180deg, #1e3070 0%, #172660 100%);
    border-bottom: 1px solid #0d1a40;
  }

  .brand-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }

  .brand-casio {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(100,160,255,0.4);
  }

  .solar-panel {
    display: flex;
    gap: 3px;
    align-items: center;
    margin-top: 3px;
  }

  .solar-cell {
    width: 10px;
    height: 6px;
    background: linear-gradient(135deg, #2a3a6a, #1a2850);
    border: 0.5px solid #3a4f8a;
    border-radius: 1px;
  }

  .model-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .model-name {
    font-size: 11px;
    color: #8aaedd;
    letter-spacing: 1px;
    font-weight: 300;
  }

  .classwiz-label {
    font-size: 9px;
    color: #6a8abc;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 300;
  }

  /* Display */
  .display-shell {
    margin: 0 12px;
    background: #1a2550;
    border-radius: 8px;
    padding: 5px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.05);
  }

  .display-inner {
    background: #c8d8a0;
    border-radius: 5px;
    padding: 8px 10px 6px;
    min-height: 68px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }

  .display-inner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 35%;
    background: rgba(255,255,255,0.1);
    border-radius: 5px 5px 0 0;
    pointer-events: none;
  }

  .display-indicators {
    display: flex;
    gap: 6px;
    margin-bottom: 2px;
    flex-wrap: wrap;
    min-height: 12px;
  }

  .indicator {
    font-size: 8px;
    color: #2a3a10;
    font-family: 'Share Tech Mono', monospace;
    opacity: 0;
    transition: opacity 0.15s;
    font-weight: 700;
  }

  .indicator.active { opacity: 1; }

  .display-expression {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: #2a3a10;
    min-height: 14px;
    text-align: right;
    word-break: break-all;
    opacity: 0.75;
    line-height: 1.3;
  }

  .display-result {
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px;
    color: #1a2a08;
    text-align: right;
    line-height: 1.2;
    word-break: break-all;
    font-weight: 700;
  }

  .display-result.small-text { font-size: 15px; }

  /* Cursor blink */
  .cursor {
    display: inline-block;
    width: 1px;
    height: 1em;
    background: #1a2a08;
    margin-left: 1px;
    vertical-align: middle;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Button area */
  .buttons-area {
    padding: 8px 10px 14px;
  }

  /* Section labels */
  .section-gap { height: 5px; }

  .btn-row {
    display: grid;
    gap: 5px;
    margin-bottom: 5px;
  }

  .row-5 { grid-template-columns: repeat(5, 1fr); }
  .row-6 { grid-template-columns: repeat(6, 1fr); }
  .row-4 { grid-template-columns: repeat(4, 1fr); }

  /* Base button */
  button {
    position: relative;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 0;
    transition: transform 0.08s, filter 0.08s;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    overflow: visible;
  }

  button:active {
    transform: scale(0.91);
    filter: brightness(0.8);
  }

  .btn-body {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    padding: 4px 2px 3px;
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 10px;
    font-weight: 400;
    line-height: 1.1;
    text-align: center;
    min-height: 30px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
  }

  .btn-top-label {
    font-size: 7px;
    line-height: 1;
    margin-bottom: 1px;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    max-width: 100%;
    text-overflow: ellipsis;
  }

  /* Above-button labels (shift/alpha labels shown above button) */
  .above-labels {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 0 2px;
    height: 11px;
    margin-bottom: 1px;
  }

  .lbl-shift {
    font-size: 7px;
    color: #f5a623;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 48%;
  }

  .lbl-alpha {
    font-size: 7px;
    color: #e05050;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 48%;
    text-align: right;
  }

  /* Color themes */
  .btn-dark {
    background: transparent;
  }
  .btn-dark .btn-body {
    background: linear-gradient(180deg, #3a4060 0%, #252840 100%);
    color: #d0d8f0;
    border: 0.5px solid #4a5080;
    box-shadow: 0 3px 0 #141830, inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .btn-num {
    background: transparent;
  }
  .btn-num .btn-body {
    background: linear-gradient(180deg, #4a5070 0%, #353860 100%);
    color: #e8ecff;
    border: 0.5px solid #5a6090;
    box-shadow: 0 3px 0 #151828, inset 0 1px 0 rgba(255,255,255,0.15);
    font-size: 13px;
    font-weight: 700;
  }

  .btn-shift {
    background: transparent;
  }
  .btn-shift .btn-body {
    background: linear-gradient(180deg, #e8a020 0%, #c07810 100%);
    color: #fff;
    border: 0.5px solid #f0b030;
    box-shadow: 0 3px 0 #704800, inset 0 1px 0 rgba(255,255,255,0.2);
    font-size: 9px;
    font-weight: 700;
  }

  .btn-alpha {
    background: transparent;
  }
  .btn-alpha .btn-body {
    background: linear-gradient(180deg, #d84040 0%, #b02020 100%);
    color: #fff;
    border: 0.5px solid #e05050;
    box-shadow: 0 3px 0 #601010, inset 0 1px 0 rgba(255,255,255,0.2);
    font-size: 9px;
    font-weight: 700;
  }

  .btn-eq {
    background: transparent;
  }
  .btn-eq .btn-body {
    background: linear-gradient(180deg, #2060e0 0%, #1040b0 100%);
    color: #fff;
    border: 0.5px solid #4080f0;
    box-shadow: 0 3px 0 #0a1860, inset 0 1px 0 rgba(255,255,255,0.2);
    font-size: 16px;
    font-weight: 700;
  }

  .btn-del {
    background: transparent;
  }
  .btn-del .btn-body {
    background: linear-gradient(180deg, #e06030 0%, #b04010 100%);
    color: #fff;
    border: 0.5px solid #e87040;
    box-shadow: 0 3px 0 #601800, inset 0 1px 0 rgba(255,255,255,0.2);
    font-size: 9px;
    font-weight: 700;
  }

  .btn-ac {
    background: transparent;
  }
  .btn-ac .btn-body {
    background: linear-gradient(180deg, #d0d0d0 0%, #a0a0a0 100%);
    color: #1a1a1a;
    border: 0.5px solid #e0e0e0;
    box-shadow: 0 3px 0 #505050, inset 0 1px 0 rgba(255,255,255,0.4);
    font-size: 11px;
    font-weight: 700;
  }

  /* Nav d-pad */
  .dpad-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 4px 0;
    margin-bottom: 5px;
  }

  .dpad {
    position: relative;
    width: 64px;
    height: 64px;
  }

  .dpad-btn {
    position: absolute;
    background: linear-gradient(180deg, #3a4070 0%, #252848 100%);
    border: 0.5px solid #4a5080;
    color: #c0c8e8;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    transition: transform 0.08s, filter 0.08s;
    box-shadow: 0 2px 0 #141828;
  }
  .dpad-btn:active { transform: scale(0.88); filter: brightness(0.75); }

  .dpad-up    { top: 0; left: 18px; width: 28px; height: 22px; border-radius: 4px 4px 0 0; }
  .dpad-down  { bottom: 0; left: 18px; width: 28px; height: 22px; border-radius: 0 0 4px 4px; }
  .dpad-left  { left: 0; top: 18px; width: 22px; height: 28px; border-radius: 4px 0 0 4px; }
  .dpad-right { right: 0; top: 18px; width: 22px; height: 28px; border-radius: 0 4px 4px 0; }

  .dpad-center {
    position: absolute;
    left: 18px; top: 18px;
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #404870, #1e2240);
    border: 0.5px solid #505888;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px;
    color: #8890b8;
    cursor: pointer;
    box-shadow: 0 2px 0 #0e1020, inset 0 1px 0 rgba(255,255,255,0.1);
    transition: transform 0.08s;
    font-family: 'Roboto Condensed', sans-serif;
  }

  .dpad-row {
    display: grid;
    grid-template-columns: 1fr 64px 1fr;
    gap: 5px;
    margin-bottom: 5px;
    align-items: center;
  }

  .dpad-side {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 5px;
    height: 64px;
  }

  .divider-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, #2a3560, transparent);
    margin: 3px 0 5px;
  }

  /* Fraction / small symbol text */
  .sym { font-size: 9px; }
  .sym-sm { font-size: 8px; }

  .btn-body sub {
    font-size: 7px;
    line-height: 0;
  }

  .mode-indicator {
    position: absolute;
    top: 8px;
    right: 16px;
    font-size: 8px;
    color: #f5a623;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.2s;
    font-family: 'Roboto Condensed', sans-serif;
    letter-spacing: 1px;
  }
  .mode-indicator.show { opacity: 1; }

  /* Bottom edge detail */
  .calc-bottom {
    height: 12px;
    background: linear-gradient(180deg, #0a1230, #060c20);
    border-radius: 0 0 26px 26px;
    border-top: 1px solid #0d1a40;
  }

  /* Error flash */
  @keyframes errorFlash {
    0%, 100% { background: #c8d8a0; }
    50% { background: #e8b0a0; }
  }
  .display-inner.error { animation: errorFlash 0.3s ease 2; }
</style>
</head>
<body>

<div class="calculator">
  <div class="calc-header">
    <div class="brand-row">
      <div class="brand-casio">CASIO</div>
      <div class="solar-panel">
        <div class="solar-cell"></div>
        <div class="solar-cell"></div>
        <div class="solar-cell"></div>
        <div class="solar-cell"></div>
      </div>
    </div>
    <div class="model-row">
      <div class="model-name">fx-991CW</div>
      <div class="classwiz-label">ClassWiz</div>
    </div>
  </div>

  <div style="padding: 8px 12px 6px; position: relative;">
    <div class="mode-indicator" id="modeIndicator">SHIFT</div>
    <div class="display-shell">
      <div class="display-inner" id="displayInner">
        <div class="display-indicators">
          <span class="indicator" id="ind-shift">S</span>
          <span class="indicator" id="ind-alpha">A</span>
          <span class="indicator" id="ind-deg">D</span>
          <span class="indicator" id="ind-rad">R</span>
          <span class="indicator" id="ind-math">Math</span>
        </div>
        <div class="display-expression" id="displayExpr"></div>
        <div class="display-result" id="displayResult">0<span class="cursor"></span></div>
      </div>
    </div>
  </div>

  <div class="buttons-area">

    <!-- Row: SHIFT, ALPHA, ON -->
    <div class="btn-row row-5">
      <button class="btn-shift" onclick="pressShift()">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha"></span></div>
        <div class="btn-body">SHIFT</div>
      </button>
      <button class="btn-alpha" onclick="pressAlpha()">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha"></span></div>
        <div class="btn-body">ALPHA</div>
      </button>
      <button class="btn-dark" onclick="pressBtn('menu')">
        <div class="above-labels"><span class="lbl-shift">SETUP</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">MENU</div>
      </button>
      <button class="btn-dark" onclick="pressBtn('undo')">
        <div class="above-labels"><span class="lbl-shift">INS</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">⌫</div>
      </button>
      <button class="btn-ac" onclick="pressAC()">
        <div class="above-labels"><span class="lbl-shift">OFF</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">AC</div>
      </button>
    </div>

    <!-- D-Pad row with CALC and OPTN -->
    <div class="dpad-row">
      <div class="dpad-side">
        <button class="btn-dark" onclick="pressFunc('calc')">
          <div class="above-labels"><span class="lbl-shift">SOLVE</span><span class="lbl-alpha"></span></div>
          <div class="btn-body" style="height:100%">CALC</div>
        </button>
        <button class="btn-dark" onclick="pressFunc('optn')">
          <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha"></span></div>
          <div class="btn-body" style="height:100%">OPTN</div>
        </button>
      </div>
      <div class="dpad-container" style="padding:0; margin:0;">
        <div class="dpad">
          <div class="dpad-btn dpad-up" onclick="pressNav('up')">▲</div>
          <div class="dpad-btn dpad-down" onclick="pressNav('down')">▼</div>
          <div class="dpad-btn dpad-left" onclick="pressNav('left')">◀</div>
          <div class="dpad-btn dpad-right" onclick="pressNav('right')">▶</div>
          <div class="dpad-center" onclick="pressNav('ok')">OK</div>
        </div>
      </div>
      <div class="dpad-side">
        <button class="btn-dark" onclick="pressFunc('fraction')">
          <div class="above-labels"><span class="lbl-shift">a b/c↔d/e</span><span class="lbl-alpha"></span></div>
          <div class="btn-body" style="height:100%;font-size:9px">a/b</div>
        </button>
        <button class="btn-dark" onclick="pressFunc('fdToggle')">
          <div class="above-labels"><span class="lbl-shift">←→</span><span class="lbl-alpha"></span></div>
          <div class="btn-body" style="height:100%;font-size:8px">f↔d</div>
        </button>
      </div>
    </div>

    <div class="divider-line"></div>

    <!-- Row: x², √, x^, log(x), ln -->
    <div class="btn-row row-5">
      <button class="btn-dark" onclick="typeFunc('sq')">
        <div class="above-labels"><span class="lbl-shift">x⁻¹</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">x²</div>
      </button>
      <button class="btn-dark" onclick="typeFunc('sqrt')">
        <div class="above-labels"><span class="lbl-shift">∛</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">√</div>
      </button>
      <button class="btn-dark" onclick="typeText('^(')">
        <div class="above-labels"><span class="lbl-shift">ˣ√</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">x<sup style="font-size:7px">□</sup></div>
      </button>
      <button class="btn-dark" onclick="typeFunc('log')">
        <div class="above-labels"><span class="lbl-shift">10ˣ</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">log</div>
      </button>
      <button class="btn-dark" onclick="typeFunc('ln')">
        <div class="above-labels"><span class="lbl-shift">eˣ</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">ln</div>
      </button>
    </div>

    <!-- Row: (-), °'", sin, cos, tan -->
    <div class="btn-row row-5">
      <button class="btn-dark" onclick="typeText('(-)')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha"></span></div>
        <div class="btn-body">(-)</div>
      </button>
      <button class="btn-dark" onclick="typeFunc('angle')">
        <div class="above-labels"><span class="lbl-shift">°'→dec</span><span class="lbl-alpha"></span></div>
        <div class="btn-body" style="font-size:9px">°' "</div>
      </button>
      <button class="btn-dark" onclick="typeFunc('sin')">
        <div class="above-labels"><span class="lbl-shift">sin⁻¹</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">sin</div>
      </button>
      <button class="btn-dark" onclick="typeFunc('cos')">
        <div class="above-labels"><span class="lbl-shift">cos⁻¹</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">cos</div>
      </button>
      <button class="btn-dark" onclick="typeFunc('tan')">
        <div class="above-labels"><span class="lbl-shift">tan⁻¹</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">tan</div>
      </button>
    </div>

    <!-- Row: RCL, ENG, (, ), STO -->
    <div class="btn-row row-5">
      <button class="btn-dark" onclick="pressRCL()">
        <div class="above-labels"><span class="lbl-shift">M+</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">RCL</div>
      </button>
      <button class="btn-dark" onclick="typeFunc('eng')">
        <div class="above-labels"><span class="lbl-shift">ENG←</span><span class="lbl-alpha"></span></div>
        <div class="btn-body" style="font-size:9px">ENG→</div>
      </button>
      <button class="btn-dark" onclick="typeText('(')">
        <div class="above-labels"><span class="lbl-shift">{</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">(</div>
      </button>
      <button class="btn-dark" onclick="typeText(')')">
        <div class="above-labels"><span class="lbl-shift">}</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">)</div>
      </button>
      <button class="btn-dark" onclick="pressSTO()">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha"></span></div>
        <div class="btn-body" style="font-size:9px">STO→</div>
      </button>
    </div>

    <div class="divider-line"></div>

    <!-- Row: 7, 8, 9, DEL -->
    <div class="btn-row" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
      <button class="btn-num" onclick="typeText('7')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha">x</span></div>
        <div class="btn-body">7</div>
      </button>
      <button class="btn-num" onclick="typeText('8')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha">y</span></div>
        <div class="btn-body">8</div>
      </button>
      <button class="btn-num" onclick="typeText('9')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha">z</span></div>
        <div class="btn-body">9</div>
      </button>
      <button class="btn-del" onclick="pressDEL()">
        <div class="above-labels"><span class="lbl-shift">INS</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">DEL</div>
      </button>
    </div>

    <!-- Row: 4, 5, 6, ×, ÷ -->
    <div class="btn-row" style="grid-template-columns: 1fr 1fr 1fr 1fr 1fr;">
      <button class="btn-num" onclick="typeText('4')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha">A</span></div>
        <div class="btn-body">4</div>
      </button>
      <button class="btn-num" onclick="typeText('5')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha">B</span></div>
        <div class="btn-body">5</div>
      </button>
      <button class="btn-num" onclick="typeText('6')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha">C</span></div>
        <div class="btn-body">6</div>
      </button>
      <button class="btn-dark" onclick="typeText('×')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha"></span></div>
        <div class="btn-body" style="font-size:14px;font-weight:700">×</div>
      </button>
      <button class="btn-dark" onclick="typeText('÷')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha"></span></div>
        <div class="btn-body" style="font-size:14px;font-weight:700">÷</div>
      </button>
    </div>

    <!-- Row: 1, 2, 3, +, - -->
    <div class="btn-row" style="grid-template-columns: 1fr 1fr 1fr 1fr 1fr;">
      <button class="btn-num" onclick="typeText('1')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha">D</span></div>
        <div class="btn-body">1</div>
      </button>
      <button class="btn-num" onclick="typeText('2')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha">E</span></div>
        <div class="btn-body">2</div>
      </button>
      <button class="btn-num" onclick="typeText('3')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha">F</span></div>
        <div class="btn-body">3</div>
      </button>
      <button class="btn-dark" onclick="typeText('+')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha"></span></div>
        <div class="btn-body" style="font-size:16px;font-weight:700">+</div>
      </button>
      <button class="btn-dark" onclick="typeText('-')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha"></span></div>
        <div class="btn-body" style="font-size:16px;font-weight:700">−</div>
      </button>
    </div>

    <!-- Row: 0, ., ×10ˣ, Ans, = -->
    <div class="btn-row" style="grid-template-columns: 1fr 1fr 1fr 1fr 1fr;">
      <button class="btn-num" onclick="typeText('0')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha">space</span></div>
        <div class="btn-body">0</div>
      </button>
      <button class="btn-num" onclick="typeText('.')">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha"></span></div>
        <div class="btn-body">.</div>
      </button>
      <button class="btn-dark" onclick="typeText('×10^')">
        <div class="above-labels"><span class="lbl-shift">π</span><span class="lbl-alpha">e</span></div>
        <div class="btn-body" style="font-size:8px">×10ˣ</div>
      </button>
      <button class="btn-dark" onclick="typeAns()">
        <div class="above-labels"><span class="lbl-shift">%</span><span class="lbl-alpha"></span></div>
        <div class="btn-body">Ans</div>
      </button>
      <button class="btn-eq" onclick="pressEq()">
        <div class="above-labels"><span class="lbl-shift"></span><span class="lbl-alpha"></span></div>
        <div class="btn-body">=</div>
      </button>
    </div>

  </div>
  <div class="calc-bottom"></div>
</div>

<script>
  let expr = '';
  let lastAns = 0;
  let shiftMode = false;
  let alphaMode = false;
  let angleMode = 'deg'; // 'deg' or 'rad'
  let justCalced = false;

  const dispResult = document.getElementById('displayResult');
  const dispExpr = document.getElementById('displayExpr');
  const dispInner = document.getElementById('displayInner');

  function updateDisplay() {
    const showExpr = expr.length > 0 ? expr : '';
    dispExpr.textContent = showExpr.length > 30 ? '…' + showExpr.slice(-30) : showExpr;
    if (!justCalced) {
      const show = expr || '0';
      dispResult.innerHTML = (show.length > 14 ? show.slice(-14) : show) + '<span class="cursor"></span>';
      dispResult.className = 'display-result' + (show.length > 10 ? ' small-text' : '');
    }
  }

  function typeText(ch) {
    clearModes();
    if (justCalced && /^[0-9.]$/.test(ch)) {
      expr = '';
    }
    justCalced = false;
    expr += ch;
    updateDisplay();
  }

  function typeFunc(fn) {
    clearModes();
    justCalced = false;
    const fnMap = {
      'sin':  'sin(',
      'cos':  'cos(',
      'tan':  'tan(',
      'log':  'log(',
      'ln':   'ln(',
      'sqrt': '√(',
      'sq':   null,
      'angle':'',
      'eng':  '',
      'fraction': '',
      'fdToggle': '',
      'calc': '',
      'optn': '',
    };
    if (fn === 'sq') {
      if (expr) expr += '²';
      else expr = 'Ans²';
    } else if (fn === 'sqrt') {
      expr += '√(';
    } else if (fnMap[fn] !== undefined && fnMap[fn] !== '') {
      expr += fnMap[fn];
    }
    updateDisplay();
  }

  function typeAns() {
    clearModes();
    justCalced = false;
    expr += 'Ans';
    updateDisplay();
  }

  function pressShift() {
    shiftMode = !shiftMode;
    alphaMode = false;
    document.getElementById('ind-shift').classList.toggle('active', shiftMode);
    document.getElementById('ind-alpha').classList.remove('active');
    document.getElementById('modeIndicator').textContent = 'SHIFT';
    document.getElementById('modeIndicator').classList.toggle('show', shiftMode);
  }

  function pressAlpha() {
    alphaMode = !alphaMode;
    shiftMode = false;
    document.getElementById('ind-alpha').classList.toggle('active', alphaMode);
    document.getElementById('ind-shift').classList.remove('active');
    document.getElementById('modeIndicator').textContent = 'ALPHA';
    document.getElementById('modeIndicator').classList.toggle('show', alphaMode);
  }

  function clearModes() {
    shiftMode = false;
    alphaMode = false;
    document.getElementById('ind-shift').classList.remove('active');
    document.getElementById('ind-alpha').classList.remove('active');
    document.getElementById('modeIndicator').classList.remove('show');
  }

  function pressDEL() {
    clearModes();
    justCalced = false;
    if (expr.endsWith('Ans')) expr = expr.slice(0, -3);
    else if (expr.endsWith('sin(') || expr.endsWith('cos(') || expr.endsWith('tan(')) expr = expr.slice(0, -4);
    else if (expr.endsWith('log(') || expr.endsWith('ln(') || expr.endsWith('√(')) expr = expr.slice(0, -3);
    else expr = expr.slice(0, -1);
    updateDisplay();
  }

  function pressAC() {
    clearModes();
    expr = '';
    justCalced = false;
    dispResult.innerHTML = '0<span class="cursor"></span>';
    dispResult.className = 'display-result';
    dispExpr.textContent = '';
  }

  function pressRCL() {
    clearModes();
    expr += lastAns.toString();
    justCalced = false;
    updateDisplay();
  }

  function pressSTO() {
    clearModes();
  }

  function pressBtn(name) {
    clearModes();
    if (name === 'undo') pressDEL();
    if (name === 'menu') {
      toggleAngleMode();
    }
  }

  function toggleAngleMode() {
    angleMode = angleMode === 'deg' ? 'rad' : 'deg';
    document.getElementById('ind-deg').classList.toggle('active', angleMode === 'deg');
    document.getElementById('ind-rad').classList.toggle('active', angleMode === 'rad');
  }

  function pressNav(dir) {}

  function toRad(deg) { return deg * Math.PI / 180; }
  function toDeg(rad) { return rad * 180 / Math.PI; }

  function pressEq() {
    clearModes();
    if (!expr) return;
    try {
      const result = evaluate(expr);
      dispExpr.textContent = expr.length > 30 ? '…' + expr.slice(-30) : expr;
      lastAns = result;
      const display = formatResult(result);
      dispResult.innerHTML = display;
      dispResult.className = 'display-result' + (display.length > 10 ? ' small-text' : '');
      justCalced = true;
    } catch(e) {
      flashError();
      dispResult.innerHTML = 'Math ERROR';
      dispResult.className = 'display-result small-text';
      expr = '';
      justCalced = true;
    }
  }

  function formatResult(n) {
    if (!isFinite(n)) return 'Math ERROR';
    if (Number.isInteger(n) && Math.abs(n) < 1e15) return n.toString();
    if (Math.abs(n) >= 1e10 || (Math.abs(n) < 1e-4 && n !== 0)) {
      return n.toExponential(6).replace(/\.?0+e/, 'e');
    }
    let s = parseFloat(n.toPrecision(10)).toString();
    return s;
  }

  function flashError() {
    dispInner.classList.add('error');
    setTimeout(() => dispInner.classList.remove('error'), 700);
  }

  function evaluate(input) {
    let s = input;
    s = s.replace(/Ans/g, '(' + lastAns + ')');
    s = s.replace(/²/g, '**2');
    s = s.replace(/×10\^/g, 'e');
    s = s.replace(/÷/g, '/');
    s = s.replace(/×/g, '*');
    s = s.replace(/−/g, '-');
    s = s.replace(/\(-\)/g, '-');

    const toR = angleMode === 'deg'
      ? x => x * Math.PI / 180
      : x => x;

    s = s.replace(/sin\(/g, '__sin(');
    s = s.replace(/cos\(/g, '__cos(');
    s = s.replace(/tan\(/g, '__tan(');
    s = s.replace(/ln\(/g, '__ln(');
    s = s.replace(/log\(/g, '__log(');
    s = s.replace(/√\(/g, '__sqrt(');

    const fn = new Function(
      '__sin', '__cos', '__tan', '__ln', '__log', '__sqrt',
      'return ' + s + ';'
    );

    return fn(
      x => Math.sin(toR(x)),
      x => Math.cos(toR(x)),
      x => Math.tan(toR(x)),
      x => Math.log(x),
      x => Math.log10(x),
      x => Math.sqrt(x)
    );
  }

  // Keyboard support
  document.addEventListener('keydown', e => {
    if (!isNaN(e.key) || e.key === '.') { typeText(e.key); return; }
    if (e.key === '+') { typeText('+'); return; }
    if (e.key === '-') { typeText('-'); return; }
    if (e.key === '*') { typeText('×'); return; }
    if (e.key === '/') { e.preventDefault(); typeText('÷'); return; }
    if (e.key === '^') { typeText('^('); return; }
    if (e.key === '(') { typeText('('); return; }
    if (e.key === ')') { typeText(')'); return; }
    if (e.key === 'Enter') { pressEq(); return; }
    if (e.key === 'Backspace') { pressDEL(); return; }
    if (e.key === 'Escape') { pressAC(); return; }
  });

  // Init indicators
  document.getElementById('ind-deg').classList.add('active');
  document.getElementById('ind-math').classList.add('active');
</script>
</body>
</html>
